services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metis
      POSTGRES_USER: metis
      POSTGRES_PASSWORD: metis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metis -d metis"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=metis;Username=metis;Password=metis;Gss Encryption Mode=Disable
      Seed__OasCsv: /data/oas.csv
      Seed__DemoEmail: ${DEMO_EMAIL:-profe@metis.cl}
      Seed__DemoPassword: ${DEMO_PASSWORD:-metis123}
      DataProtection__KeysPath: /keys
      # IA (Claude). Sin API key, Metis responde con reglas y la creación con IA arma un esquema de ejemplo.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      Ia__Modelo: ${IA_MODELO:-claude-opus-5-5}
    volumes:
      - ./data:/data:ro
      - apikeys:/keys
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  apikeys:
